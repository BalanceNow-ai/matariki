name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run tells you nothing useful once a newer commit exists.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        # The Sanity fetches in these pages fail without credentials and are
        # designed to fall back, so the build must still succeed without them.
        run: pnpm build
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: gjwqcjfo
          NEXT_PUBLIC_SANITY_DATASET: production
